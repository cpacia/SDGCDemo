    <radialGradient id="glow" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </radialGradient>
  </defs>

  <circle cx="120" cy="120" r="118" fill="url(#glow)"/>
  <circle cx="120" cy="120" r="115" fill="none" stroke="#b45cf0" stroke-width="5"/>
  <circle cx="120" cy="120" r="76" fill="none" stroke="#ffffff" stroke-width="1.5" opacity=".22"/>

  
    <path d="M90 134a30 30 0 0 1 60 0z" fill="#b45cf0"/>
